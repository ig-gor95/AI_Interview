# Production Docker Compose для Timeweb Cloud
# PostgreSQL в контейнере (не managed database)

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_hr_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aihr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_hr_db}
      # Оптимизация для production
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"  # Только localhost доступ
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Оптимизированная конфигурация PostgreSQL
      - ./postgres-config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aihr_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai_hr_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_hr_backend
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aihr_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_hr_db}
      POSTGRES_USER: ${POSTGRES_USER:-aihr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_hr_db}

      # AI Services
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/gcp-credentials.json}

      # TTS Settings
      TTS_VOICE_NAME: ${TTS_VOICE_NAME:-ru-RU-Chirp3-HD-Orus}
      TTS_LANGUAGE_CODE: ${TTS_LANGUAGE_CODE:-ru-RU}
      TTS_SPEAKING_RATE: ${TTS_SPEAKING_RATE:-1.0}
      TTS_PITCH: ${TTS_PITCH:-0.0}

      # Security
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # CORS - добавьте ваш домен
      CORS_ORIGINS: ${CORS_ORIGINS}

      # Environment
      ENVIRONMENT: production
      DEBUG: "false"

      # Storage
      AUDIO_STORAGE_PATH: /app/audio_files
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-50}

      # Analyzers
      ENABLED_ANALYZERS: ${ENABLED_ANALYZERS:-gpt_content_analyzer,clarity_analyzer}
      PRONUNCIATION_WEIGHT: ${PRONUNCIATION_WEIGHT:-0.2}
      CLARITY_WEIGHT: ${CLARITY_WEIGHT:-0.15}
      GPT_CONTENT_WEIGHT: ${GPT_CONTENT_WEIGHT:-0.5}
      STRESS_HANDLING_WEIGHT: ${STRESS_HANDLING_WEIGHT:-0.15}

    ports:
      - "127.0.0.1:8000:8000"  # Только localhost (nginx будет проксировать)
    volumes:
      # Persistent storage для аудио файлов
      - audio_files:/app/audio_files
      # GCP credentials (если используется файл)
      - ./gcp-credentials.json:/app/gcp-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai_hr_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./AI Tutor Dashboard-8
      dockerfile: Dockerfile
    container_name: ai_hr_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates from Let's Encrypt
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Nginx SSL config
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai_hr_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  audio_files:
    driver: local

networks:
  ai_hr_network:
    driver: bridge
