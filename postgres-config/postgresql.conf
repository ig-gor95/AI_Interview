# PostgreSQL Configuration для Timeweb VPS (2 vCPU, 4GB RAM)
# Оптимизировано для небольшого production сервера

# Memory Settings
shared_buffers = 1GB                    # 25% от RAM (4GB * 0.25)
effective_cache_size = 3GB              # 75% от RAM
work_mem = 8MB                          # Для сортировок и хэшей
maintenance_work_mem = 256MB            # Для VACUUM, CREATE INDEX

# Checkpoint Settings
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# Connection Settings
listen_addresses = '*'                  # Listen on all interfaces for Docker network
max_connections = 100                   # Достаточно для небольшого проекта
superuser_reserved_connections = 3

# Query Tuning
random_page_cost = 1.1                  # Для SSD дисков
effective_io_concurrency = 200          # Для SSD

# Write Performance
synchronous_commit = on                 # Для надежности данных
full_page_writes = on

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000       # Логировать медленные запросы (>1s)
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Autovacuum
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 60s

# Locale
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# Default Settings
default_text_search_config = 'pg_catalog.english'
